<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Day 3 — Game Takes the Stage</title>
  <desc id="desc">Social preview graphic for the Day 3 devlog about merging the game runtime into the engine.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="45%" stop-color="#0a1f38" />
      <stop offset="100%" stop-color="#11243f" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4dd3ff" />
      <stop offset="100%" stop-color="#9c6bff" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2">
    <path d="M80 120h1040M80 240h1040M80 360h1040M80 480h1040" />
    <path d="M160 60v510M320 60v510M480 60v510M640 60v510M800 60v510M960 60v510" />
  </g>
  <text x="110" y="210" fill="#4dd3ff" font-family="'Segoe UI', 'Inter', sans-serif" font-size="72" letter-spacing="0.04em">BLACKFRAME AI DEVLOG</text>
  <text x="110" y="300" fill="#ffffff" font-family="'Segoe UI Semibold', 'Inter', sans-serif" font-size="110" letter-spacing="0.03em">GAME TAKES THE STAGE</text>
  <text x="110" y="390" fill="#9c6bff" font-family="'Segoe UI', 'Inter', sans-serif" font-size="48" letter-spacing="0.05em">DAY 3 — ENGINE + RUNTIME UNIFIED</text>
  <rect x="110" y="430" width="420" height="6" fill="url(#accent)" rx="3" />
  <text x="110" y="500" fill="#d6e8ff" font-family="'Segoe UI', 'Inter', sans-serif" font-size="34" letter-spacing="0.05em">Minimal mode retired • Debug views now draw the live sprite stack</text>
  <text x="110" y="550" fill="#88c4ff" font-family="'Segoe UI', 'Inter', sans-serif" font-size="30" letter-spacing="0.05em">Purge of the Crescent Veil — Studio Dispatch</text>
</svg>
