name: ci

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "tests/**"
      - "functions/**"
      - "assets/**"
      - "*.js"
      - "*.mjs"
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify docs assets
        run: npm run check:assets
